name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Install locked dependencies
        run: uv sync --locked --dev --python "${{ matrix.python-version }}"

      - name: Run tests
        run: uv run --python "${{ matrix.python-version }}" pytest

      - name: Run Ruff
        run: uv run --python "${{ matrix.python-version }}" ruff check .

      - name: Run strict Mypy
        run: uv run --python "${{ matrix.python-version }}" mypy src
