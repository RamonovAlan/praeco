[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "praeco"
version = "0.0.1"
description = "Owner-operated, approval-first Telegram to LinkedIn publishing workflow"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Praeco contributors" }]
dependencies = [
  "cryptography==46.0.7",
]

[project.scripts]
praeco = "praeco.application:main"
praeco-backup = "praeco.backup_cli:main"

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==9.1.1",
  "ruff==0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/praeco"]
exclude = ["src/praeco/private_ops.py"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "praeco/resources/migrations"
"prompts" = "praeco/resources/prompts"
"config/style.example.yaml" = "praeco/resources/config/style.example.yaml"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.env.ops.example",
  "/.github/workflows/backup.yml",
  "/docs/backup-and-restore.md",
  "/railway.toml",
  "/scripts/export_public_snapshot.py",
  "/src/praeco/private_ops.py",
  "/tests/test_private_deployment.py",
  "/tests/test_private_ops.py",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
